name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          unzip -o ms-companion.zip -d extracted_temp
          # Yeh command settings.gradle.kts ko dhoondhegi aur saari files root me laa degi
          PROJECT_ROOT=$(dirname $(find extracted_temp -name "settings.gradle.kts" | head -n 1))
          if [ -n "$PROJECT_ROOT" ]; then
            cp -r $PROJECT_ROOT/* . 2>/dev/null || true
          fi
          rm -rf extracted_temp ms-companion.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        # Bina gradlew ke direct inbuilt system gradle command use karenge
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
