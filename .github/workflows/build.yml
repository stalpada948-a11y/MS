name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip & Fix Hidden Files
        run: |
          unzip -o ms-companion.zip -d temp_extract
          
          # Root directory setup with normal and hidden files (.env.example, etc)
          PROJECT_ROOT=$(dirname $(find temp_extract -name "settings.gradle.kts" | head -n 1))
          
          if [ -n "$PROJECT_ROOT" ]; then
            cp -r $PROJECT_ROOT/* . 2>/dev/null || true
            cp -r $PROJECT_ROOT/.* . 2>/dev/null || true
          fi
          
          rm -rf temp_extract ms-companion.zip

      - name: Create Failsafe .env.example
        run: touch .env.example

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
