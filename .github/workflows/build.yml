name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          unzip -o ms-companion.zip -d extracted_temp
          # Sub-folder se saari files root me move karne ke liye:
          if [ -d "extracted_temp/ms-companion" ]; then
            mv extracted_temp/ms-companion/* . 2>/dev/null || true
            mv extracted_temp/ms-companion/.* . 2>/dev/null || true
          else
            mv extracted_temp/*/* . 2>/dev/null || true
            mv extracted_temp/* . 2>/dev/null || true
          fi
          rm -rf extracted_temp ms-companion.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable & Build
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
