name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip Correctly
        run: |
          mkdir -p temp_extract
          unzip -o ms-companion.zip -d temp_extract
          
          # Root directory setup with hidden files (.gradle, etc)
          INNER_DIR=$(find temp_extract -maxdepth 2 -name "build.gradle*" -o -name "settings.gradle*" | head -n 1 | xargs dirname)
          if [ -n "$INNER_DIR" ]; then
            cp -rn $INNER_DIR/* . 2>/dev/null || true
            cp -rn $INNER_DIR/.* . 2>/dev/null || true
          fi
          rm -rf temp_extract ms-companion.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.unsafe.isolated-projects=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
