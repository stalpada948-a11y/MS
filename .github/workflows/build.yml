name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip & Fix Hidden Files
        run: |
          unzip -o xo-ai-assistant.zip -d temp_extract
          
          PROJECT_ROOT=$(dirname $(find temp_extract -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1))
          
          if [ -n "$PROJECT_ROOT" ]; then
            cp -r $PROJECT_ROOT/* . 2>/dev/null || true
            cp -r $PROJECT_ROOT/.* . 2>/dev/null || true
          fi
          
          rm -rf temp_extract xo-ai-assistant.zip

      - name: Create Failsafe .env.example
        run: touch .env.example

      - name: Create Matching google-services.json
        run: |
          mkdir -p app
          cat <<EOF > app/google-services.json
          {
            "project_info": { 
              "project_number": "123456789", 
              "project_id": "dummy-project" 
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef",
                  "android_client_info": { 
                    "package_name": "com.aistudio.mscompanion.sumit" 
                  }
                },
                "api_key": [ { "current_key": "dummy-key" } ]
              }
            ]
          }
          EOF

      - name: Generate Dummy Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Force Headless and Disable KSP Daemon
        run: |
          echo "org.gradle.jvmargs=-Djava.awt.headless=true -Xmx2048m" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          echo "ksp.use.worker.api=false" >> gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: gradle assembleDebug --no-daemon -Djava.awt.headless=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
